<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting Friends - Registro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .register-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
            padding: 20px;
        }
        
        .decorative-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.15;
            pointer-events: none;
        }
        
        .blob-1 {
            width: 180px;
            height: 180px;
            background: #F59E42;
            top: -40px;
            right: -40px;
        }
        
        .blob-2 {
            width: 200px;
            height: 200px;
            background: var(--accent-blue);
            bottom: 50px;
            left: -60px;
        }
        
        .logo-container {
            padding: 20px 0 15px 0;
            text-align: center;
        }
        
        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #F59E42, var(--accent-blue));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            box-shadow: 0 8px 25px rgba(112, 71, 235, 0.3);
        }
        
        .input-field {
            background-color: var(--bg-card);
            border: 2px solid var(--border-color);
            color: var(--text-white);
            transition: all 0.3s ease;
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
        }
        
        .input-field:focus {
            border-color: var(--accent-blue);
            outline: none;
            box-shadow: 0 0 0 3px rgba(112, 71, 235, 0.1);
        }
        
        .input-field::placeholder {
            color: var(--text-light);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #F59E42, #E8844A);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(245, 158, 66, 0.4);
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        
        .btn-primary:active {
            transform: scale(0.98);
        }
        
        .password-strength {
            height: 4px;
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        
        .floating-animation {
            animation: floating 3s ease-in-out infinite;
        }
        
        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        
        .success-message {
            background-color: rgba(16, 185, 129, 0.1);
            border-left: 4px solid #10B981;
        }
        
        .error-message {
            background-color: rgba(239, 68, 68, 0.1);
            border-left: 4px solid #EF4444;
        }
    </style>
</head>
<body>
    
    <div class="app-container">
        <div class="register-screen">
            <!-- Decorative blobs -->
            <div class="decorative-blob blob-1"></div>
            <div class="decorative-blob blob-2"></div>
            
            <!-- Logo & Header -->
            <div class="logo-container">
                <div class="logo-icon floating-animation">
                    <i class="fas fa-user-plus text-2xl text-white"></i>
                </div>
                <h1 class="text-2xl font-bold mb-2">Connecting Friends</h1>
                <p class="text-xs" style="color: var(--text-light);">Crea tu cuenta y comienza</p>
            </div>
            
            <!-- Header -->
            <div class="mt-6 mb-5">
                <h2 class="text-xl font-bold mb-1">Crear Cuenta</h2>
                <p class="text-sm" style="color: var(--text-light);">Completa el formulario para registrarte</p>
            </div>
            
            <!-- Register Form -->
            <form id="register-form" class="space-y-4">
                
                <!-- Name Input -->
                <div>
                    <label for="name" class="block text-sm font-semibold mb-2">
                        <i class="fas fa-user mr-2"></i>Nombre Completo
                    </label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name"
                        class="input-field" 
                        placeholder="Juan Pérez"
                        required
                    >
                </div>
                
                <!-- Email Input -->
                <div>
                    <label for="email" class="block text-sm font-semibold mb-2">
                        <i class="fas fa-envelope mr-2"></i>Correo Electrónico
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        class="input-field" 
                        placeholder="tu@email.com"
                        required
                    >
                </div>
                
                <!-- Password Input -->
                <div>
                    <label for="password" class="block text-sm font-semibold mb-2">
                        <i class="fas fa-lock mr-2"></i>Contraseña
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            class="input-field pr-12" 
                            placeholder="••••••••"
                            required
                            oninput="checkPasswordStrength()"
                        >
                        <button 
                            type="button" 
                            onclick="togglePassword('password')"
                            class="absolute right-4 top-1/2 -translate-y-1/2"
                            style="color: var(--text-light);"
                        >
                            <i class="fas fa-eye" id="toggle-icon-password"></i>
                        </button>
                    </div>
                    <div class="mt-2">
                        <div class="password-strength bg-gray-700" id="password-strength-bar"></div>
                        <p class="text-xs mt-1" style="color: var(--text-light);" id="password-strength-text">Mínimo 6 caracteres</p>
                    </div>
                </div>
                
                <!-- Confirm Password Input -->
                <div>
                    <label for="confirm-password" class="block text-sm font-semibold mb-2">
                        <i class="fas fa-lock mr-2"></i>Confirmar Contraseña
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="confirm-password" 
                            name="confirm-password"
                            class="input-field pr-12" 
                            placeholder="••••••••"
                            required
                        >
                        <button 
                            type="button" 
                            onclick="togglePassword('confirm-password')"
                            class="absolute right-4 top-1/2 -translate-y-1/2"
                            style="color: var(--text-light);"
                        >
                            <i class="fas fa-eye" id="toggle-icon-confirm-password"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Terms & Conditions -->
                <div class="flex items-start">
                    <input type="checkbox" id="terms" class="mt-1 mr-2 rounded" style="accent-color: var(--accent-blue);" required>
                    <label for="terms" class="text-xs" style="color: var(--text-light);">
                        Acepto los <a href="#" class="font-semibold" style="color: #F59E42;">Términos y Condiciones</a> 
                        y la <a href="#" class="font-semibold" style="color: #F59E42;">Política de Privacidad</a>
                    </label>
                </div>
                
                <!-- Register Button -->
                <button 
                    type="submit" 
                    class="btn-primary w-full py-4 rounded-xl font-bold text-lg mt-6"
                >
                    Crear Cuenta
                </button>
                
                <!-- Login Link -->
                <p class="text-center text-sm mt-5" style="color: var(--text-light);">
                    ¿Ya tienes una cuenta? 
                    <a href="login.html" class="font-bold" style="color: #F59E42;">Inicia sesión aquí</a>
                </p>
            </form>
            
            <!-- Success Message -->
            <div id="success-message" class="hidden mt-4 p-4 success-message rounded-xl">
                <div class="flex items-center">
                    <i class="fas fa-check-circle text-green-500 mr-3"></i>
                    <p class="text-green-400 text-sm" id="success-text"></p>
                </div>
            </div>
            
            <!-- Error Message -->
            <div id="error-message" class="hidden mt-4 p-4 error-message rounded-xl">
                <div class="flex items-center">
                    <i class="fas fa-exclamation-circle text-red-500 mr-3"></i>
                    <p class="text-red-400 text-sm" id="error-text"></p>
                </div>
            </div>
            
            <!-- Footer Space -->
            <div class="h-8"></div>
        </div>
    </div>
    
    <script>
        // Toggle password visibility
        function togglePassword(fieldId) {
            const passwordInput = document.getElementById(fieldId);
            const toggleIcon = document.getElementById('toggle-icon-' + fieldId);
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }
        
        // Longitud de contraseña
        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            const strengthBar = document.getElementById('password-strength-bar');
            const strengthText = document.getElementById('password-strength-text');
            
            let strength = 0;
            
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z\d]/.test(password)) strength++;
            
            switch(strength) {
                case 0:
                case 1:
                    strengthBar.style.width = '25%';
                    strengthBar.style.backgroundColor = '#EF4444';
                    strengthText.textContent = 'Muy débil';
                    strengthText.style.color = '#EF4444';
                    break;
                case 2:
                    strengthBar.style.width = '50%';
                    strengthBar.style.backgroundColor = '#F59E0B';
                    strengthText.textContent = 'Débil';
                    strengthText.style.color = '#F59E0B';
                    break;
                case 3:
                    strengthBar.style.width = '75%';
                    strengthBar.style.backgroundColor = '#FBBF24';
                    strengthText.textContent = 'Buena';
                    strengthText.style.color = '#FBBF24';
                    break;
                case 4:
                case 5:
                    strengthBar.style.width = '100%';
                    strengthBar.style.backgroundColor = '#10B981';
                    strengthText.textContent = 'Muy fuerte';
                    strengthText.style.color = '#10B981';
                    break;
            }
        }
        
        // Registro
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            // Validacion passwords coiciden
            if (password !== confirmPassword) {
                document.getElementById('error-text').textContent = 'Las contraseñas no coinciden';
                document.getElementById('error-message').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('error-message').classList.add('hidden');
                }, 5000);
                return;
            }
            
            // Validacion password longitud
            if (password.length < 6) {
                document.getElementById('error-text').textContent = 'La contraseña debe tener al menos 6 caracteres';
                document.getElementById('error-message').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('error-message').classList.add('hidden');
                }, 5000);
                return;
            }
            
            try {
                const response = await fetch('registro.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        name: name,
                        email: email,
                        password: password
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Show success message
                    document.getElementById('success-text').textContent = result.message;
                    document.getElementById('success-message').classList.remove('hidden');
                    
                    // Reset form
                    document.getElementById('register-form').reset();
                    document.getElementById('password-strength-bar').style.width = '0%';
                    
                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    // Show error message
                    document.getElementById('error-text').textContent = result.message;
                    document.getElementById('error-message').classList.remove('hidden');
                    
                    setTimeout(() => {
                        document.getElementById('error-message').classList.add('hidden');
                    }, 5000);
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('error-text').textContent = 'Error de conexión. Intenta nuevamente.';
                document.getElementById('error-message').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
